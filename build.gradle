plugins {
    id 'java'
    id 'eclipse'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'com.diffplug.eclipse.apt' version '3.26.0'
    id 'org.liquibase.gradle' version '3.0.1'
}

group = 'eu.goldenkoopa'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.0'
    testImplementation 'org.springframework.security:spring-security-test'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.jetbrains:annotations:15.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.1'
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // implementation 'org.liquibase:liquibase-core:4.32.0'
    // runtimeOnly 'org.liquibase.ext:liquibase-hibernate6:4.32.0'

}

bootRun {
    environment 'spring.output.ansi.console-available', true
}

tasks.register('buildDockerImage') {
    group = 'Docker'
    description = 'Builds docker image and pushes it'

    doLast {
        def imageName = project.findProperty('imageName') ?: "goldenkoopa/${project.name}"
        exec {
            commandLine 'docker', 'build', '-t', imageName, '.'
        }

        exec {
            commandLine 'docker', 'push', imageName
        }

        exec {
            commandLine 'docker', 'image', 'rm', imageName
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

